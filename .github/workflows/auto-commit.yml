name: Auto Commit Activity

on:
  schedule:
    # Runs 5 times daily (01:00, 06:00, 11:00, 16:00, 21:00 UTC) (~08:00, 13:00, 18:00, 23:00, 04:00 WIB)
    - cron: '0 1,6,11,16,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update log file
        run: |
          mkdir -p .autocommit
          echo "Update on $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> .autocommit/activity.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .autocommit/activity.txt
          git diff --staged --quiet || git commit -m "chore: daily auto activity update"
          git push
