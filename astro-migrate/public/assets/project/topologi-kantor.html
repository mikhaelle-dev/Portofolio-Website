<title>Topologi Jaringan Kantor</title>
<style>
:root{--font:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;--bg:#ffffff;--text:#111827;--muted:#5b6573;--zone_fill:#f3f6fa;--zone_stroke:#c5cfdc;--cable:#000000;--dev:#036897;--detail:#ffffff;--panel:#f3f6fa;}
:root[data-theme="dark"]{--bg:#12151a;--text:#f3f4f6;--muted:#a7b0bc;--zone_fill:#1a1f27;--zone_stroke:#3b4554;--cable:#ffffff;--dev:#1e90c8;--detail:#ffffff;--panel:#1a1f27;}
:root[data-theme="dark"] .cctv-img{filter:brightness(0) invert(1)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#topo{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
#topo.grab{cursor:grabbing}
.bar{position:fixed;top:12px;right:12px;display:flex;gap:6px;z-index:2}
.bar button{font:600 13px var(--font);color:var(--text);background:var(--panel);border:1px solid var(--zone_stroke);
  border-radius:8px;padding:7px 12px;cursor:pointer}
.bar button:hover{border-color:var(--dev)}
.bar button:focus-visible{outline:2px solid var(--dev);outline-offset:2px}
.hint{position:fixed;left:12px;bottom:10px;font:400 12px var(--font);color:var(--muted);z-index:2}
@media print{.bar,.hint{display:none}}

.zone{fill:var(--zone_fill);stroke:var(--zone_stroke);stroke-width:1.2}
.zt{font-family:var(--font);font-size:13px;font-weight:700;fill:var(--text)}
.zs{font-family:var(--font);font-size:10.5px;fill:var(--muted)}
.lk{fill:none;stroke:var(--cable);stroke-linejoin:round}
.trunk{stroke-width:3;stroke-dasharray:9 9}
.access{stroke-width:2}
.wifi{stroke-width:3;stroke-dasharray:3 6}
.dv{fill:var(--dev)}
.dw{fill:var(--detail)}
.dp{fill:var(--detail);stroke:var(--dev);stroke-width:1.5}
.sf{fill:var(--dev)}.sw{fill:var(--detail)}.sk{fill:#000}.sfn{fill:none}
.ss{stroke:var(--detail)}.ssd{stroke:var(--dev)}.ssk{stroke:#000}.ssn{stroke:none}
.dl{fill:none;stroke:var(--detail);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dst{fill:none;stroke:var(--dev);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.dsm{fill:none;stroke:var(--dev);stroke-width:2.5;stroke-linecap:round}
.dwt{font-family:var(--font);font-size:13px;font-weight:700;fill:var(--detail);text-anchor:middle}
.nm{font-family:var(--font);font-size:11px;font-weight:500;fill:var(--text)}
.nmb{font-family:var(--font);font-size:12px;font-weight:700;fill:var(--text)}
.sb{font-family:var(--font);font-size:10px;fill:var(--muted)}
.title{font-family:var(--font);font-size:26px;font-weight:800;fill:var(--text)}
.sub{font-family:var(--font);font-size:13px;fill:var(--muted)}
.vn{font-family:var(--font);font-size:12px;font-weight:700;fill:var(--text)}
.vt{font-family:var(--font);font-size:12px;fill:var(--text)}

</style>

<div class="bar">
  <button id="theme" type="button">Mode Gelap</button>
  <button id="zin" type="button" title="Perbesar">+</button>
  <button id="zout" type="button" title="Perkecil">&minus;</button>
  <button id="fit" type="button">Pas layar</button>
</div>
<div class="hint">Scroll = zoom &middot; seret = geser</div>
<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('theme');
  function setTheme(t){
    root.setAttribute('data-theme',t);
    btn.textContent=t==='dark'?'Mode Terang':'Mode Gelap';
    try{localStorage.setItem('topologi-theme',t)}catch(e){}
  }
  var saved=null; try{saved=localStorage.getItem('topologi-theme')}catch(e){}
  setTheme(saved||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  btn.addEventListener('click',function(){setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark')});

  var svg=document.getElementById('topo'), scene=document.getElementById('scene');
  var B={x:0,y:6,w:2106,h:1686}, k=1, tx=0, ty=0;
  function apply(){scene.setAttribute('transform','translate('+tx+' '+ty+') scale('+k+')')}
  function fit(){
    var r=svg.getBoundingClientRect(), pad=24;
    k=Math.min((r.width-pad*2)/B.w,(r.height-pad*2)/B.h);
    tx=(r.width-B.w*k)/2-B.x*k; ty=(r.height-B.h*k)/2-B.y*k; apply();
  }
  function zoomAt(mx,my,f){
    var nk=Math.min(5,Math.max(0.1,k*f)); f=nk/k;
    tx=mx-(mx-tx)*f; ty=my-(my-ty)*f; k=nk; apply();
  }
  svg.addEventListener('wheel',function(e){
    e.preventDefault(); var r=svg.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0015));
  },{passive:false});
  var drag=null;
  svg.addEventListener('pointerdown',function(e){
    drag={x:e.clientX,y:e.clientY,tx:tx,ty:ty}; svg.setPointerCapture(e.pointerId); svg.classList.add('grab');
  });
  svg.addEventListener('pointermove',function(e){
    if(!drag)return; tx=drag.tx+e.clientX-drag.x; ty=drag.ty+e.clientY-drag.y; apply();
  });
  function end(){drag=null; svg.classList.remove('grab')}
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  function mid(f){var r=svg.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,f)}
  document.getElementById('zin').addEventListener('click',function(){mid(1.25)});
  document.getElementById('zout').addEventListener('click',function(){mid(0.8)});
  document.getElementById('fit').addEventListener('click',fit);
  window.addEventListener('resize',fit);
  fit();
  var CCTV='https://icons.diagrams.net/icon-cache1/Crime_and_Security-2352/23-1167.svg', probe=new Image();
  probe.onload=function(){
    [].forEach.call(document.querySelectorAll('.cctv-img'),function(i){i.setAttribute('href',CCTV);i.style.display=''});
    [].forEach.call(document.querySelectorAll('.cctv-fb'),function(g){g.style.display='none'});
  };
  probe.src=CCTV;
})();
</script>
