    <script src="js/script.js" defer></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const certGridAll = document.getElementById('cert-grid-all');


            function renderGrid() {
                if (certGridAll && typeof certData !== 'undefined') {
                    certGridAll.innerHTML = ''; // Clear before re-rendering
                    certData.forEach(cert => {
                        const displayDesc = (typeof currentLang !== 'undefined' && currentLang === 'id' && cert.desc_id) ? cert.desc_id : cert.desc;

                        const card = document.createElement('div');
                        card.className = "card-outline liquid-glass card-layered rounded-[2.5rem] overflow-hidden transition-all duration-500 hover:-translate-y-3 hover:shadow-[0_20px_50px_rgba(var(--primary-rgb,143,176,96),0.15)] group cursor-pointer p-4 flex flex-col";
                        card.innerHTML = `
                            <div class="rounded-[2rem] overflow-hidden mb-4 p-0 cert-media" data-aspect="auto">
                                <img src="${cert.img}" class="w-full h-full object-cover rounded-[1.75rem] opacity-95 group-hover:opacity-100 group-hover:scale-[1.03] transition-all duration-700" loading="lazy">
                            </div>
                            <div class="px-3 pb-2 flex-1 flex flex-col">
                                <div class="flex justify-between items-start mb-1">
                                    <h3 class="font-bold text-xl text-on-surface dark:text-white leading-tight group-hover:text-primary transition-colors origin-left">${cert.title}</h3>
                                    <span class="material-symbols-outlined text-primary text-lg group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform">north_east</span>
                                </div>
                                <p class="font-medium text-sm text-on-surface-variant dark:text-gray-400 line-clamp-2 leading-relaxed">${displayDesc}</p>
                                <div class="mt-auto pt-3 flex justify-between items-center text-[10px] font-bold text-on-surface-variant dark:text-gray-500 uppercase tracking-widest border-t border-black/5 dark:border-white/5">
                                    <span class="truncate w-2/3">${cert.provider}</span>
                                    <span class="text-on-surface-variant dark:text-gray-500">${cert.date}</span>
                                </div>
                            </div>
                        `;
                        const mediaEl = card.querySelector('.cert-media');
                        const imgEl = card.querySelector('img');

                        // Auto-resize wrapper to match the certificate image proportion (after load)
                        const applyAspect = () => {
                            if (!mediaEl || !imgEl || !imgEl.naturalWidth || !imgEl.naturalHeight) return;
                            const ratio = imgEl.naturalWidth / imgEl.naturalHeight; // width/height
                            // aspect-ratio expects width/height
                            mediaEl.style.aspectRatio = `${ratio}`;
                        };

                        if (imgEl) {
                            if (imgEl.complete) applyAspect();
                            imgEl.addEventListener('load', applyAspect, { once: true });
                        }

                        card.addEventListener('click', () => {
                            if (typeof openProjectModal === 'function') {
                                openProjectModal({
                                    ...cert,
                                    category: 'Certification',
                                    category_id: 'Sertifikasi',
                                    year: cert.date,
                                    tech: [cert.provider, 'Credential verified']
                                });
                            }
                        });
                        certGridAll.appendChild(card);
                    });
                }
            }

            renderGrid();
            document.addEventListener('languageChanged', renderGrid);



            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal-section').forEach(el => observer.observe(el));


            // --- Theme Color Switcher Logic ---
            const colorBtns = document.querySelectorAll('.theme-color-btn');
            const root = document.documentElement;
            const savedColor = localStorage.getItem('theme-color');
            if (savedColor) root.style.setProperty('--primary', savedColor);

            colorBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const color = btn.getAttribute('data-color');
                    root.style.setProperty('--primary', color);
                    localStorage.setItem('theme-color', color);
                    btn.classList.add('scale-150');
                    setTimeout(() => btn.classList.remove('scale-150'), 200);
                });
            });
        });
    </script>
